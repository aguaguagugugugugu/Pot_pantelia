name: Build musl binary

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # чтобы можно было запускать вручную из вкладки Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Verify static linking
        run: |
          file target/x86_64-unknown-linux-musl/release/keyfox
          ldd target/x86_64-unknown-linux-musl/release/keyfox || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyfox-musl
          path: target/x86_64-unknown-linux-musl/release/keyfox
          if-no-files-found: error
